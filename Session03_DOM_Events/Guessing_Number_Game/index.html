<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-AU-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css">
    <title>Guessing Number Game</title>
</head>
<body>
    <header>
        <h1>Guessing Number Game</h1>
        <p class="between">(Between 1 and 100)</p>
        <button class="btn again">Play Again!</button>
        <div class="number">?</div>
    </header>
    <main>
        <section class="left">
            <input type="number" min="1" max="100" class="guess">
            <button class="btn check">Check!</button>
        </section>
        <section class="right">
            <p class="message">Start guessing...</p>
            <p class="label-score">💯 Score: <span class="score">100</span></p>
            <p class="label-highscore">
            🥇 Highscore: <span class="highscore">0</span>
            </p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
